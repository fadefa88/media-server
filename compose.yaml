services:
  postgres:
    image: postgres:17-alpine
    container_name: vela-postgres
    restart: unless-stopped
    env_file:
      - /opt/vela/config/.env
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=20
    volumes:
      - /opt/vela/data/postgres:/var/lib/postgresql/data
    mem_limit: 256m
    mem_reservation: 96m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - vela

  vela:
    build:
      context: .
    container_name: vela-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - /opt/vela/config/.env
    environment:
      DB_HOST: postgres
      PORT: 4173
    volumes:
      - /media:/media:ro
      - /opt/vela/cache:/opt/vela/cache
      - /opt/vela/transcode:/opt/vela/transcode
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    ports:
      - "4173:4173"
    mem_limit: 2g
    mem_reservation: 512m
    security_opt:
      - no-new-privileges:true
    networks:
      - vela

networks:
  vela:
    driver: bridge
