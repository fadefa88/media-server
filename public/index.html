<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<title>VELA</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#11151d;--line:rgba(255,255,255,.09);--muted:#8993a5;--fg:#f6f8fb;--good:#9fe5bd;--bad:#ff9c9c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#273b48 0,transparent 36%),var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}main{max-width:980px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px 90px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{font-weight:800;letter-spacing:.22em;font-size:13px}.mark{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);border-radius:50%;margin-right:10px}.pulse{font-size:11px;color:var(--muted)}.hero{padding:28px 0 14px}.hero h1{font-size:clamp(42px,9vw,80px);line-height:.9;letter-spacing:-.06em;margin:0}.hero p{color:var(--muted);max-width:620px;font-size:15px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 28px}button{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--fg);border-radius:999px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#fff;color:#0b0d11}.status{border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:24px;padding:16px;margin-bottom:22px;backdrop-filter:blur(18px)}.statusTop{display:flex;justify-content:space-between;gap:12px}.bar{height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:#fff;width:0}.small{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.card{min-height:150px;border:1px solid var(--line);border-radius:24px;padding:16px;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));display:flex;flex-direction:column;justify-content:space-between;text-align:left}.card.invalid{border-color:rgba(255,120,120,.28)}.ey{font-size:9px;letter-spacing:.13em;color:var(--muted)}.title{font-size:17px;font-weight:750;margin-top:8px;overflow-wrap:anywhere}.meta{font-size:10px;color:var(--muted);margin-top:12px;line-height:1.5}.mode{display:inline-flex;font-size:9px;padding:5px 7px;border:1px solid var(--line);border-radius:999px;margin-top:10px}dialog{width:min(760px,calc(100% - 24px));max-height:calc(100dvh - 24px);overflow:auto;border:1px solid var(--line);border-radius:28px;background:#10141b;color:var(--fg);padding:20px}dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(8px)}pre{white-space:pre-wrap;font-size:11px;color:#b7c0ce}.row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}video{display:none;width:100%;max-height:60dvh;background:#000;border-radius:18px;margin-top:16px}.playStatus{margin-top:10px;font-size:11px;color:var(--muted)}.playStatus.ok{color:var(--good)}.playStatus.err{color:var(--bad)}
</style>
</head>
<body>
<main>
<header><div class="brand"><span class="mark">V</span>VELA</div><div class="pulse" id="health">connessione…</div></header>
<section class="hero"><div class="ey">PRIVATE CINEMA · CLIENT FIRST</div><h1>La tua libreria,<br>senza sprechi.</h1><p>VELA mantiene il video originale ogni volta che il dispositivo può decodificarlo. Direct, remux HLS/fMP4 e transcode del solo audio.</p></section>
<div class="actions"><button class="primary" onclick="scan(10)">Scansiona 10</button><button onclick="scan(100)">Scansiona 100</button><button onclick="scan(0)">Scansiona tutto</button><button onclick="load()">Aggiorna libreria</button></div>
<section class="status"><div class="statusTop"><b>Scanner</b><span class="small" id="scanText">—</span></div><div class="bar"><i id="bar"></i></div><div class="small" id="current">Nessuna scansione attiva.</div></section>
<section class="grid" id="grid"></section>
</main>
<dialog id="detail">
  <div id="detailBody"></div>
  <video id="player" controls playsinline preload="metadata"></video>
  <div id="playStatus" class="playStatus"></div>
  <div class="row"><button onclick="closeDetail()">Chiudi</button><div><button id="decisionBtn">Client First</button> <button class="primary" id="playBtn">Riproduci originale</button></div></div>
  <pre id="decision"></pre>
</dialog>
<script>
const $=s=>document.querySelector(s);let activePlayback=null;
async function api(url,opts){const r=await fetch(url,opts);let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||r.statusText);return j}
async function health(){try{const h=await api('/api/health');$('#health').textContent=`online · v${h.version} · ${h.playback?.join(' / ')||'client first'}`}catch{$('#health').textContent='offline'}}
async function scan(limit){await api('/api/scan',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({limit})});poll()}
async function poll(){try{const s=await api('/api/scan/status');const pct=s.total?Math.round(s.processed/s.total*1000)/10:0;$('#bar').style.width=pct+'%';$('#scanText').textContent=`${s.processed}/${s.total} · ${pct}% · validi ${s.valid} · invalidi ${s.invalid}`;$('#current').textContent=s.current||(s.finishedAt?'Scansione completata.':'Nessuna scansione attiva.');if(s.running)setTimeout(poll,1000);else load()}catch{}}
function meta(m){return [m.video_codec,m.video_profile,m.width&&m.height?`${m.width}×${m.height}`:null,m.bit_depth?`${m.bit_depth}-bit`:null,m.hdr].filter(Boolean).join(' · ')}
function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){const d=await api('/api/media?limit=200');$('#grid').innerHTML=d.items.map(m=>`<button class="card ${m.status==='INVALID'?'invalid':''}" onclick="openMedia(${m.id})"><div><div class="ey">${m.status}</div><div class="title">${escapeHtml(m.filename)}</div></div><div><div class="meta">${escapeHtml(meta(m))}</div><span class="mode">${m.container?.includes('matroska')?'REMUX candidate':'DIRECT candidate'}</span></div></button>`).join('')||'<div class="small">Libreria vuota.</div>'}
function clientCaps(){const v=document.createElement('video');const supports=t=>Boolean(v.canPlayType(t));const videoCodecs=['h264'];if(supports('video/mp4; codecs="hvc1"'))videoCodecs.push('hevc');const audioCodecs=['aac'];if(supports('audio/mp4; codecs="ac-3"'))audioCodecs.push('ac3');if(supports('audio/mp4; codecs="ec-3"'))audioCodecs.push('eac3');return{videoCodecs,audioCodecs,containers:['mp4','mov','hls','fmp4'],subtitleFormats:['srt','vtt','webvtt'],maxWidth:4096,maxHeight:2160,networkMbps:100,audioLanguages:['ita','it','eng','en'],subtitleLanguages:['ita','it','eng','en']}}
function playbackBody(){return{client:clientCaps(),forceOriginal:true,subtitlesEnabled:false}}
async function openMedia(id){await stopActive();const d=await api('/api/media/'+id);const m=d.media;$('#detailBody').innerHTML=`<div class="ey">MEDIA ${id}</div><h2>${escapeHtml(m.filename)}</h2><div class="meta">${escapeHtml(meta(m))}<br>${escapeHtml(m.relative_path)}<br>${d.streams.length} tracce</div>`;$('#decision').textContent='';$('#playStatus').textContent='';$('#playStatus').className='playStatus';const p=$('#player');p.pause();p.removeAttribute('src');p.load();p.style.display='none';$('#decisionBtn').onclick=async()=>{const x=await api(`/api/media/${id}/decision`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(playbackBody())});$('#decision').textContent=JSON.stringify(x,null,2)};$('#playBtn').onclick=()=>playMedia(id);$('#detail').showModal()}
async function playMedia(id){const s=$('#playStatus');const p=$('#player');s.textContent='Preparazione playback…';s.className='playStatus';try{await stopActive();const x=await api(`/api/media/${id}/playback`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(playbackBody())});if(x.sessionId)activePlayback=x.sessionId;s.textContent=`${x.decision.mode} · video ${x.decision.videoAction} · audio ${x.decision.audioAction}`;s.className='playStatus ok';if(x.type==='HLS'&&!p.canPlayType('application/vnd.apple.mpegurl'))throw new Error('Questo browser non riproduce HLS nativamente: prova il playback da iPhone/Safari in questa fase.');p.src=x.url;p.style.display='block';await p.play()}catch(e){s.textContent=e.message;s.className='playStatus err'}}
async function stopActive(){if(activePlayback){const id=activePlayback;activePlayback=null;try{await fetch('/api/playback/'+id,{method:'DELETE'})}catch{}}}
async function closeDetail(){const p=$('#player');p.pause();p.removeAttribute('src');p.load();await stopActive();$('#detail').close()}
$('#detail').addEventListener('cancel',e=>{e.preventDefault();closeDetail()});health();poll();load();
</script>
</body>
</html>
