<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<title>VELA</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#11151d;--line:rgba(255,255,255,.09);--muted:#8993a5;--fg:#f6f8fb;--good:#9fe5bd;--bad:#ff9c9c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#273b48 0,transparent 36%),var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}main{max-width:980px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px 90px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{font-weight:800;letter-spacing:.22em;font-size:13px}.mark{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);border-radius:50%;margin-right:10px}.pulse{font-size:11px;color:var(--muted)}.hero{padding:28px 0 14px}.hero h1{font-size:clamp(42px,9vw,80px);line-height:.9;letter-spacing:-.06em;margin:0}.hero p{color:var(--muted);max-width:620px;font-size:15px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 28px}button,select{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--fg);border-radius:999px;padding:11px 15px;font-weight:700}button{cursor:pointer}.primary{background:#fff;color:#0b0d11}.status{border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:24px;padding:16px;margin-bottom:22px;backdrop-filter:blur(18px)}.statusTop{display:flex;justify-content:space-between;gap:12px}.bar{height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:#fff;width:0}.small{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.card{min-height:150px;border:1px solid var(--line);border-radius:24px;padding:16px;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));display:flex;flex-direction:column;justify-content:space-between;text-align:left}.card.invalid{border-color:rgba(255,120,120,.28)}.ey{font-size:9px;letter-spacing:.13em;color:var(--muted)}.title{font-size:17px;font-weight:750;margin-top:8px;overflow-wrap:anywhere}.meta{font-size:10px;color:var(--muted);margin-top:12px;line-height:1.5}.mode{display:inline-flex;font-size:9px;padding:5px 7px;border:1px solid var(--line);border-radius:999px;margin-top:10px}dialog{width:min(880px,calc(100% - 16px));max-height:calc(100dvh - 16px);overflow:auto;border:1px solid var(--line);border-radius:28px;background:#10141b;color:var(--fg);padding:18px}dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(8px)}pre{white-space:pre-wrap;font-size:11px;color:#b7c0ce}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}video{display:none;width:100%;max-height:58dvh;background:#000;border-radius:18px;margin-top:16px}.playStatus{margin-top:10px;font-size:11px;color:var(--muted)}.playStatus.ok{color:var(--good)}.playStatus.err{color:var(--bad)}.playerControls{display:none;margin-top:12px;border:1px solid var(--line);border-radius:20px;padding:12px;background:rgba(255,255,255,.035)}.timeline{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}.timeline input{width:100%}.ctrlrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.ctrlrow button,.ctrlrow select{padding:8px 11px;font-size:11px}.ctrlrow .grow{flex:1}.trackLabel{font-size:9px;color:var(--muted);margin-right:-3px}.hidden{display:none!important}@media(max-width:600px){dialog{padding:12px;border-radius:20px}.timeline{grid-template-columns:1fr}.timeline .time{display:none}.ctrlrow{gap:6px}.ctrlrow button,.ctrlrow select{padding:8px 9px}}
</style>
</head>
<body>
<main>
<header><div class="brand"><span class="mark">V</span>VELA</div><div class="pulse" id="health">connessione…</div></header>
<section class="hero"><div class="ey">PRIVATE CINEMA · CLIENT FIRST</div><h1>La tua libreria,<br>senza sprechi.</h1><p>Video originale sul client quando possibile. Direct, remux HLS/fMP4, audio-only transcode, seek arbitrario e sottotitoli WebVTT.</p></section>
<div class="actions"><button class="primary" onclick="scan(10)">Scansiona 10</button><button onclick="scan(100)">Scansiona 100</button><button onclick="scan(0)">Scansiona tutto</button><button onclick="load()">Aggiorna libreria</button></div>
<section class="status"><div class="statusTop"><b>Scanner</b><span class="small" id="scanText">—</span></div><div class="bar"><i id="bar"></i></div><div class="small" id="current">Nessuna scansione attiva.</div></section>
<section class="grid" id="grid"></section>
</main>
<dialog id="detail">
  <div id="detailBody"></div>
  <video id="player" playsinline preload="metadata"></video>
  <div id="playerControls" class="playerControls">
    <div class="timeline"><span class="time" id="currentTime">00:00</span><input id="seek" type="range" min="0" max="1" step="1" value="0"><span class="time" id="duration">00:00</span></div>
    <div class="ctrlrow">
      <button id="playPause">Play</button>
      <span class="trackLabel">Audio</span><select id="audioSelect"><option value="">Auto</option></select>
      <span class="trackLabel">Sub</span><select id="subtitleSelect"><option value="">Off</option></select>
      <select id="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
      <span class="grow"></span><button id="pipBtn">PiP</button><button id="airplayBtn">AirPlay</button><button id="fullBtn">Schermo intero</button>
    </div>
  </div>
  <div id="playStatus" class="playStatus"></div>
  <div class="row"><button onclick="closeDetail()">Chiudi</button><div><button id="decisionBtn">Client First</button> <button class="primary" id="playBtn">Riproduci</button></div></div>
  <pre id="decision"></pre>
</dialog>
<script>
const $=s=>document.querySelector(s);const TEXT_SUBS=new Set(['subrip','srt','ass','ssa','webvtt','vtt','mov_text']);let activePlayback=null,activeMedia=null,activeType=null,playbackOffset=0,activeDuration=0,restarting=false;
async function api(url,opts){const r=await fetch(url,opts);let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||r.statusText);return j}
async function health(){try{const h=await api('/api/health');$('#health').textContent=`online · v${h.version} · ${h.playback?.join(' / ')||'client first'}`}catch{$('#health').textContent='offline'}}
async function scan(limit){await api('/api/scan',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({limit})});poll()}
async function poll(){try{const s=await api('/api/scan/status');const pct=s.total?Math.round(s.processed/s.total*1000)/10:0;$('#bar').style.width=pct+'%';$('#scanText').textContent=`${s.processed}/${s.total} · ${pct}% · validi ${s.valid} · invalidi ${s.invalid}`;$('#current').textContent=s.current||(s.finishedAt?'Scansione completata.':'Nessuna scansione attiva.');if(s.running)setTimeout(poll,1000);else load()}catch{}}
function meta(m){return [m.video_codec,m.video_profile,m.width&&m.height?`${m.width}×${m.height}`:null,m.bit_depth?`${m.bit_depth}-bit`:null,m.hdr].filter(Boolean).join(' · ')}
function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(sec){sec=Math.max(0,Math.floor(Number(sec)||0));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
async function load(){const d=await api('/api/media?limit=200');$('#grid').innerHTML=d.items.map(m=>`<button class="card ${m.status==='INVALID'?'invalid':''}" onclick="openMedia(${m.id})"><div><div class="ey">${m.status}</div><div class="title">${escapeHtml(m.filename)}</div></div><div><div class="meta">${escapeHtml(meta(m))}</div><span class="mode">${m.container?.includes('matroska')?'REMUX candidate':'DIRECT candidate'}</span></div></button>`).join('')||'<div class="small">Libreria vuota.</div>'}
function clientCaps(){const v=document.createElement('video');const supports=t=>Boolean(v.canPlayType(t));const videoCodecs=['h264'];if(supports('video/mp4; codecs="hvc1"'))videoCodecs.push('hevc');const audioCodecs=['aac'];if(supports('audio/mp4; codecs="ac-3"'))audioCodecs.push('ac3');if(supports('audio/mp4; codecs="ec-3"'))audioCodecs.push('eac3');return{videoCodecs,audioCodecs,containers:['mp4','mov','hls','fmp4'],subtitleFormats:['vtt','webvtt'],maxWidth:4096,maxHeight:2160,networkMbps:100,audioLanguages:['ita','it','eng','en'],subtitleLanguages:['ita','it','eng','en']}}
function selectedValue(id){const v=$(id).value;return v===''?undefined:Number(v)}
function playbackBody(startSeconds=0){const subtitleStreamIndex=selectedValue('#subtitleSelect');return{client:clientCaps(),forceOriginal:true,startSeconds,audioStreamIndex:selectedValue('#audioSelect'),subtitleStreamIndex,subtitlesEnabled:subtitleStreamIndex!==undefined}}
function labelTrack(t){return [t.language||'und',t.title,t.codec_name,t.channels?`${t.channels}ch`:null,t.is_default?'default':null,t.is_forced?'forced':null].filter(Boolean).join(' · ')}
function fillTracks(streams){const audios=streams.filter(s=>s.codec_type==='audio');$('#audioSelect').innerHTML='<option value="">Auto</option>'+audios.map(t=>`<option value="${t.stream_index}">${escapeHtml(labelTrack(t))}</option>`).join('');const subs=streams.filter(s=>s.codec_type==='subtitle'&&TEXT_SUBS.has(String(s.codec_name||'').toLowerCase()));const bitmap=streams.filter(s=>s.codec_type==='subtitle'&&!TEXT_SUBS.has(String(s.codec_name||'').toLowerCase())).length;$('#subtitleSelect').innerHTML='<option value="">Off</option>'+subs.map(t=>`<option value="${t.stream_index}">${escapeHtml(labelTrack(t))}</option>`).join('');return bitmap}
async function openMedia(id){await stopActive();const d=await api('/api/media/'+id);activeMedia=d.media;activeDuration=Number(d.media.duration_seconds||0);playbackOffset=0;activeType=null;const bitmap=fillTracks(d.streams);$('#detailBody').innerHTML=`<div class="ey">MEDIA ${id}</div><h2>${escapeHtml(d.media.filename)}</h2><div class="meta">${escapeHtml(meta(d.media))}<br>${escapeHtml(d.media.relative_path)}<br>${d.streams.length} tracce${bitmap?` · ${bitmap} sottotitoli bitmap richiedono burn-in`:''}</div>`;$('#decision').textContent='';$('#playStatus').textContent='';$('#playStatus').className='playStatus';const p=$('#player');p.pause();p.removeAttribute('src');removeTracks();p.load();p.style.display='none';$('#playerControls').style.display='none';$('#seek').max=Math.max(1,Math.floor(activeDuration));$('#seek').value=0;updateTime(0);$('#decisionBtn').onclick=async()=>{const x=await api(`/api/media/${id}/decision`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(playbackBody(0))});$('#decision').textContent=JSON.stringify(x,null,2)};$('#playBtn').onclick=()=>playMedia(id,0,true);$('#detail').showModal()}
function removeTracks(){for(const t of [...$('#player').querySelectorAll('track')])t.remove()}
function attachSubtitle(){removeTracks();const idx=selectedValue('#subtitleSelect');if(idx===undefined||!activeMedia)return;const track=document.createElement('track');track.kind='subtitles';track.label='VELA';track.srclang='it';track.src=`/api/media/${activeMedia.id}/subtitle/${idx}.vtt?offset=${activeType==='HLS'?playbackOffset:0}`;track.default=true;$('#player').appendChild(track);setTimeout(()=>{if(track.track)track.track.mode='showing'},300)}
function waitEvent(el,name,timeout=12000){return new Promise((resolve,reject)=>{const done=()=>{clearTimeout(timer);el.removeEventListener(name,done);resolve()};const timer=setTimeout(()=>{el.removeEventListener(name,done);reject(new Error(`timeout ${name}`))},timeout);el.addEventListener(name,done,{once:true})})}
async function playMedia(id,startSeconds=0,autoplay=true){if(restarting)return;restarting=true;const s=$('#playStatus'),p=$('#player');s.textContent=`Preparazione da ${fmt(startSeconds)}…`;s.className='playStatus';try{await stopActive();const x=await api(`/api/media/${id}/playback`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(playbackBody(startSeconds))});if(x.sessionId)activePlayback=x.sessionId;activeType=x.type;playbackOffset=x.type==='HLS'?Number(x.startSeconds||0):0;activeDuration=Number(x.durationSeconds||activeDuration);$('#seek').max=Math.max(1,Math.floor(activeDuration));s.textContent=`${x.decision.mode} · video ${x.decision.videoAction} · audio ${x.decision.audioAction}`;s.className='playStatus ok';if(x.type==='HLS'&&!p.canPlayType('application/vnd.apple.mpegurl'))throw new Error('Questo browser non riproduce HLS nativamente: usa Safari/iPhone per questa fase.');p.pause();p.src=x.url;p.style.display='block';$('#playerControls').style.display='block';const loaded=waitEvent(p,'loadedmetadata').catch(()=>{});p.load();await loaded;if(x.type==='DIRECT'&&startSeconds>0){try{p.currentTime=Math.min(startSeconds,p.duration||startSeconds)}catch{}}attachSubtitle();p.playbackRate=Number($('#speed').value||1);if(autoplay)await p.play();updateControls()}catch(e){s.textContent=e.message;s.className='playStatus err'}finally{restarting=false}}
function globalTime(){const p=$('#player');return Math.max(0,Math.min(activeDuration||Infinity,(activeType==='HLS'?playbackOffset:0)+(Number(p.currentTime)||0)))}
function updateTime(value){$('#currentTime').textContent=fmt(value);$('#duration').textContent=fmt(activeDuration)}
function updateControls(){const p=$('#player'),t=globalTime();if(!$('#seek').matches(':active'))$('#seek').value=Math.min(Number($('#seek').max),Math.floor(t));updateTime(t);$('#playPause').textContent=p.paused?'Play':'Pausa'}
async function seekTo(target){target=Math.max(0,Math.min(activeDuration-0.5,Number(target)||0));const p=$('#player');if(!activeMedia)return;if(!p.src){await playMedia(activeMedia.id,target,true);return}if(activeType==='DIRECT'){p.currentTime=target;updateControls();return}const resume=!p.paused;await playMedia(activeMedia.id,target,resume)}
async function stopActive(){if(activePlayback){const id=activePlayback;activePlayback=null;try{await fetch('/api/playback/'+id,{method:'DELETE'})}catch{}}}
async function closeDetail(){const p=$('#player');p.pause();p.removeAttribute('src');removeTracks();p.load();await stopActive();activeMedia=null;activeType=null;playbackOffset=0;$('#detail').close()}
$('#player').addEventListener('timeupdate',updateControls);$('#player').addEventListener('play',updateControls);$('#player').addEventListener('pause',updateControls);$('#player').addEventListener('ended',updateControls);$('#seek').addEventListener('input',e=>updateTime(Number(e.target.value)));$('#seek').addEventListener('change',e=>seekTo(Number(e.target.value)));$('#playPause').onclick=()=>{const p=$('#player');if(!p.src&&activeMedia)return playMedia(activeMedia.id,globalTime(),true);p.paused?p.play():p.pause()};$('#audioSelect').onchange=()=>{if(activeMedia&&$('#player').src)seekTo(globalTime())};$('#subtitleSelect').onchange=()=>attachSubtitle();$('#speed').onchange=()=>{$('#player').playbackRate=Number($('#speed').value)};$('#fullBtn').onclick=()=>{const p=$('#player');if(p.requestFullscreen)p.requestFullscreen();else if(p.webkitEnterFullscreen)p.webkitEnterFullscreen()};$('#pipBtn').onclick=async()=>{const p=$('#player');try{if(document.pictureInPictureElement)await document.exitPictureInPicture();else if(p.requestPictureInPicture)await p.requestPictureInPicture();else if(p.webkitSetPresentationMode)p.webkitSetPresentationMode('picture-in-picture')}catch{}};$('#airplayBtn').onclick=()=>{const p=$('#player');if(p.webkitShowPlaybackTargetPicker)p.webkitShowPlaybackTargetPicker()};if(!('webkitShowPlaybackTargetPicker'in HTMLVideoElement.prototype))$('#airplayBtn').classList.add('hidden');if(!document.pictureInPictureEnabled&&!('webkitSetPresentationMode'in HTMLVideoElement.prototype))$('#pipBtn').classList.add('hidden');$('#detail').addEventListener('cancel',e=>{e.preventDefault();closeDetail()});health();poll();load();
</script>
</body>
</html>
