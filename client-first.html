<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07090d"><meta name="apple-mobile-web-app-capable" content="yes"><title>VELA Client First</title><style>:root{--a:#9cc7c5;--b:#1e4e54;--c:#081015;--fg:#f7f8fb;--muted:rgba(247,248,251,.58);--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#07090d;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}body{min-height:100vh}.bg{position:fixed;inset:-20%;background:radial-gradient(60% 50% at 75% 12%,color-mix(in srgb,var(--a) 70%,transparent),transparent 60%),radial-gradient(65% 55% at 18% 45%,color-mix(in srgb,var(--b) 78%,transparent),transparent 64%),linear-gradient(155deg,var(--c),#05070a 72%);transition:.6s}.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.04),rgba(0,0,0,.48) 58%,#07090d 92%)}main{position:relative;z-index:2;max-width:480px;margin:auto;padding:calc(14px + var(--safeT)) 18px calc(110px + var(--safeB))}.top{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:800;letter-spacing:.22em}.mark{width:30px;height:30px;border:1px solid rgba(255,255,255,.28);border-radius:52% 48% 56% 44%;display:grid;place-items:center}.pill{font-size:8px;padding:8px 10px;border:1px solid rgba(255,255,255,.11);border-radius:999px;background:rgba(255,255,255,.05);backdrop-filter:blur(18px)}.hero{padding-top:40px}.ey{font-size:8px;letter-spacing:.19em;color:rgba(255,255,255,.58);text-transform:uppercase}.poster{height:290px;margin:14px 0 20px;border-radius:34px;position:relative;overflow:hidden;background:linear-gradient(145deg,var(--a),var(--b) 54%,var(--c));border:1px solid rgba(255,255,255,.1 lay:flex;justify-content:space-between}.modebar{display:flex;justify-content:space-between;margin-top:16px}.modebar button{border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.18);color:#fff;border-radius:999px;padding:9px 11px;font-size:8px}</style></head><body><div class="bg"></div><main><div class="top"><div class="brand"><span class="mark">V</span>VELA</div><div class="pill">CLIENT FIRST</div></div><section class="hero"><div class="ey" id="ey">PER TE, STASERA</div><div class="poster"><small>PRIVATE CINEMA · CLIENT-FIRST</small><strong id="posterTitle">ARRIVAL</strong></div><h1 id="title">Arrival</h1><p class="tag" id="tag">Il tempo non è una linea. È una lingua.</p><div class="chips" id="chips"></div><button class="play" id="play">▶ Riproduci</button><div class="card"><div class="cardHead"><b>Client First Playback</b><small id="modeTop">DIRECT</small></div><div class="flow"><button id="d">DIRECT</button><button id="r">REMUX</button><button id="a">AUDIO</button><button id="v">VIDEO</button></div><p class="explain" id="why"></p><div class="tech"><div><small>VIDEO</small><b id="videoAction">COPY → iPhone</b></div><div><small>CARICO SERVER</small><b id="cpu">Minimo</b></div></div></div><div class="rail" id="rail"></div></section></main><div class="player" id="player"><div class="pt"><button id="close">⌄</button><div><small>ORA IN RIPRODUZIONE</small><b id="ptitle">Arrival</b></div><button>•••</button></div><div class="pc"><button>−10</button><button class="main">Ⅱ</button><button>+10</button></div><div class="pb"><div class="badge"><i class="dot"></i><span id="badge">DIRECT · VIDEO → iPHONE</span></div><div class="timeline"><i></i></div><div class="playerInfo"><span>42:16</span><span id="playerWhy">Decodifica hardware sul dispositivo</span></div><div class="modebar"><button>CC</button><button>Audio</button><button>Client First</button><button>AirPlay</button></div></div></div><script>const media=[{id:'arrival',title:'Arrival',ey:'Per te, stasera',tag:'Il tempo non è una linea. È una lingua.',tech:['4K','HEVC','HDR10','AAC','MP4'],mode:'DIRECT',p:['#9cc7c5','#1e4e54','#081015'],why:'Il file è già compatibile. Il mini‑PC serve i byte; l’iPhone decodifica video e audio in hardware.',video:'COPY → iPhone',cpu:'Minimo'},{id:'california',title:'California',ey:'Memorie',tag:'Luglio, luce e strada.',tech:['4K','HEVC','HDR','AAC','MKV'],mode:'REMUX',p:['#f2c18b','#bb6f54','#29120f'],why:'MKV non viene ricodificato: VELA cambia solo contenitore in fMP4/HLS. Il video resta identico.',video:'COPY → iPhone',cpu:'Minimo'},{id:'dune',title:'Dune',ey:'Grande schermo',tag:'Il deserto ha una memoria.',tech:['4K','HEVC','HDR10','DTS','MKV'],mode:'AUDIO_TRANSCODE',p:['#d4ad78','#6b4729','#170e08'],why:'HEVC resta originale. Solo DTS viene convertito in AAC; l’iPhone continua a decodificare il video.',video:'COPY → iPhone',cpu:'Basso'},{id:'signal',title:'Signal Bloom',ey:'Caso limite',tag:'Solo quando serve davvero.',tech:['4K','AV1','HDR10','AAC','55 Mbps'],mode:'VIDEO_TRANSCODE',p:['#b58ad8','#442a61','#120d19'],why:'Ultima risorsa: il client o la rete non possono usare l’originale. Solo qui VELA ricodifica il video.',video:'TRANSCODE',cpu:'Alto'}];let cur=media[0];const $=s=>document.querySelector(s);function pick(id){cur=media.find(x=>x.id===id)||cur;document.documentElement.style.setProperty('--a',cur.p[0]);document.documentElement.style.setProperty('--b',cur.p[1]);document.documentElement.style.setProperty('--c',cur.p[2]);$('#title').textContent=cur.title;$('#posterTitle').textContent=cur.title.toUpperCase();$('#ey').textContent=cur.ey;$('#tag').textContent=cur.tag;$('#chips').innerHTML=cur.tech.map(x=>`<span>${x}</span>`).join('');$('#modeTop').textContent=cur.mode.replace('_TRANSCODE','');$('#why').textContent=cur.why;$('#videoAction').textContent=cur.video;$('#cpu').textContent=cur.cpu;['d','r','a','v'].forEach(x=>$('#'+x).classList.remove('on'));$('#'+({DIRECT:'d',REMUX:'r',AUDIO_TRANSCODE:'a',VIDEO_TRANSCODE:'v'}[cur.mode])).classList.add('on');document.querySelectorAll('.scene').forEach(x=>x.classList.toggle('on',x.dataset.id===cur.id))}$('#rail').innerHTML=media.map((m,i)=>`<button class="scene ${i?'':'on'}" data-id="${m.id}" style="--x:${m.p[0]};--y:${m.p[1]};--z:${m.p[2]}"><span>${m.title}</span></button>`).join('');document.addEventListener('click',e=>{const s=e.target.closest('.scene');if(s)pick(s.dataset.id)});$('#play').onclick=()=>{$('#ptitle').textContent=cur.title;$('#badge').textContent={DIRECT:'DIRECT · VIDEO → iPHONE',REMUX:'REMUX · VIDEO ORIGINALE → iPHONE',AUDIO_TRANSCODE:'AUDIO ONLY · VIDEO → iPHONE',VIDEO_TRANSCODE:'VIDEO TRANSCODE · ULTIMA RISORSA'}[cur.mode];$('#playerWhy').textContent=cur.mode==='VIDEO_TRANSCODE'?'Server transcode':'Decodifica hardware sul dispositivo';$('#player').classList.add('open')};$('#close').onclick=()=>$('#player').classList.remove('open');pick(cur.id);</script></body></html>
