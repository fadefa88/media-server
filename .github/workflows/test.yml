name: VELA tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/server.mjs
      - run: node --check src/tmdb.mjs
      - run: node --check src/library.mjs
      - run: node --check src/metadata-rescue.mjs
      - run: node --check public/app.js
      - run: node --check public/rescue.js
      - run: node --check public/plex.js
      - run: node --check public/pf-data.js
      - run: node --check public/plex-fidelity.js
      - run: node --check public/pf-ui-fixes.js
      - run: node --check public/metadata-editor.js
      - run: npm test
